#项目相关配置
project:
  profile: ./file

# Spring Boot 配置
spring:
  # 从项目外的私有配置文件加载密钥，避免密码随代码提交
  config:
    import: optional:file:${user.home}/.config/doublecharacter/db.properties
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  # 数据源配置
  datasource:
    #使用阿里巴巴数据源池
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接URL
    # jdbc:mysql 表示使用JDBC连接MySQL数据库
    # 3306 表示数据库端口号
    # double_character 表示数据库名称
    # useUnicode=true 表示使用Unicode编码
    # characterEncoding=utf8 表示使用UTF-8编码
    # useSSL=true 表示使用SSL连接（安全）
    # serverTimezone=Asia/Shanghai 表示使用东八区时区
    url: jdbc:mysql://localhost:3306/double_character?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: root
    # 优先使用环境变量 DB_PASSWORD，本地开发则读取上面导入的私有配置
    password: ${DB_PASSWORD}

  data:
    # Redis 配置
    redis:
        # Redis数据库索引（默认为0）
        database: 1
        # Redis服务器地址
        host: 127.0.0.1
        # Redis服务器连接端口
        port: 6379
        # Redis服务器连接密码（默认为空）
        # password: YourPassword
        # 连接超时时间
        lettuce:
          pool:
            # 连接池最大连接数
            max-active: 200
            # 连接池最大阻塞等待时间（使用负值表示没有限制）
            max-wait: -1ms
            # 连接池中的最大空闲连接
            max-idle: 10
            # 连接池中的最小空闲连接
            min-idle: 0


# 服务器配置
server:
  port: 8080
  servlet:
    # 应用访问路径 （根路径） /api
    # 例如：http://localhost:8080/api/character
    context-path: /api

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto

# Sa-Token 配置 (文档: https://sa-token.com)
sa-token:
  # Token 名称
  token-name: uuid

  # 默认 Token 最长有效期
  # -1 表示不设置绝对过期时间
  timeout: -1

  # 默认活跃时间：30天
  active-timeout: 2592000

  # 开启动态 activeTimeout
  dynamic-active-timeout: true

  # 允许多设备登录
  is-concurrent: true

  # 每次登录生成独立 Token
  is-share: false

  token-style: uuid

  # 只从 Cookie 读取
  is-read-header: false
  is-read-cookie: true
  is-read-body: false
  is-read-url: false

  # Cookie 默认持久化，登录时可以单独覆盖
  is-lasting-cookie: true

  # Cookie 安全配置
  cookie:
    path: /
    http-only: true
    secure: false
    same-site: Lax

  is-log: true
